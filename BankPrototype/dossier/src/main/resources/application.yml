mail:
    applicationDeniedText: Accepting a refusal on a loan application is just a page in your history. Don't forget that even in failure there are lessons and opportunities. Disappointment is just a new challenge, a new impetus for development. Get up after the fall and move on, there are still many opportunities to get better!
    applicationDeniedTheme: Refusal to issue a loan
    createDocumentsText: Paperwork is the next step on the way to your wealth! You are creating the foundation for your future success. Don't forget that every mark, every signature in the document is a step forward to your dream. Go ahead and don't stop!
    createDocumentsTheme: Create document
    creditIssuedText: Here it is - the cherished link to the signing of documents! You are so close to realizing your dreams! Don't be afraid to step into the unknown and take this decisive step. I am sure that every signature hides a new opportunity. Let every click be a step towards your victory!
    creditIssuedTheme: Link to signing documents
    finishRegistrationText: Finishing the initial design, you take the first step towards your goals and dreams! You are ready to be a part of something bigger, and I am sure that you will succeed. Go ahead, overcome obstacles and reach the top! Together with our credit!
    finishRegistrationTheme: Finish registration of the application
    sendDocumentsText: Congratulations! You have received the generated documents by mail. This is a testament to your progress and perseverance. Now reality has become a little closer to your dreams. Do not doubt your abilities, go ahead and achieve your goals!
    sendDocumentsTheme: Getting generated documents
    sendSesText: Congratulations on receiving the SES code for signing documents! This code contains your strength and confidence. Be bold and decisive when signing. This is your chance to make your mark on the path to success. Do not doubt your ability to overcome any obstacles! Your ses code -
    sendSesTheme: Getting the SES code
server:
    port: 8083
spring:
    kafka:
        bootstrap-servers: ${KAFKA_SERVER}
        consumer:
            group-id: dossier
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    mail:
        host: smtp.yandex.ru
        password: ${MAIL_PASSWORD:test}
        port: 465
        properties:
            mail:
                smtp:
                    auth: true
                    ssl:
                        enable: true
                    starttls:
                        enable: true
        protocol: smtp
        username: ${MAIL_USERNAME:test@test.test}
topic-name:
    application-denied: application_denied
    create-documents: create_documents
    credit-issued: credit_issued
    finish-registration: finish_registration
    send-documents: send_documents
    send-ses: send_ses